name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.1 php8.1-cli php8.1-common php8.1-mbstring php8.1-xml php8.1-mysql php8.1-curl php8.1-zip php8.1-sqlite3 php8.1-bcmath php8.1-gd > /dev/null 2>&1 || true
          php -v
          composer --version

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Optimize for production
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize

      - name: 🚀 Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./
          dangerous-clean-slate: true
          exclude: |
            .git*
            .git/**
            node_modules/**
            .github/**
            tests/**
            .env
            .env.example
            *.md
            composer.json
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            tailwind.config.js
            postcss.config.js
            .editorconfig
            .prettierignore
            .eslintignore
            docker/**
            python-ai-agent/**
            !vendor/**
