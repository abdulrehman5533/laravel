name: Deploy to InfinityFree

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        run: |
          echo "Installing software-properties-common..."
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          echo "Adding ondrej/php PPA..."
          sudo add-apt-repository -y ppa:ondrej/php
          echo "Updating package lists..."
          sudo apt-get update
          echo "Installing PHP 8.4..."
          sudo apt-get install -y php8.4 php8.4-cli php8.4-common php8.4-mbstring php8.4-xml php8.4-mysql php8.4-curl php8.4-zip php8.4-sqlite3 php8.4-bcmath php8.4-gd
          echo "PHP Installation complete. Version:"
          php -v
          echo "Installing Composer..."
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          echo "Composer Installation complete. Version:"
          composer --version

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Optimize for production
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize

      - name: 🚀 Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./
          dangerous-clean-slate: true
          exclude: |
            .git*
            .git/**
            node_modules/**
            .github/**
            tests/**
            .env
            .env.example
            *.md
            composer.json
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            tailwind.config.js
            postcss.config.js
            .editorconfig
            .prettierignore
            .eslintignore
            docker/**
            python-ai-agent/**
            !vendor/**
